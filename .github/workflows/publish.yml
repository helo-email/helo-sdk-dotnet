name: Publish

# Publishes to nuget.org when a version tag (e.g. 1.0.1, 1.0.1-beta.1) is
# pushed, once the same tests that gate pull requests pass.
# release.yml also dispatches it against the tag it creates, since tags pushed
# with GITHUB_TOKEN don't trigger `push` workflows.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref_name }}

permissions:
  contents: read

jobs:
  test:
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/test.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write # NuGet trusted publishing
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Check tag matches package version
        run: |
          version=$(dotnet msbuild src/HeloEmail.Sdk/HeloEmail.Sdk.csproj -getProperty:Version)
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version" && exit 1
          fi

      - name: Pack
        run: dotnet pack src/HeloEmail.Sdk/HeloEmail.Sdk.csproj --configuration Release --output artifacts

      # Exchanges the workflow's OIDC token for a short-lived API key, per the
      # trusted publishing policy for this repository on nuget.org.
      - uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push package
        run: >-
          dotnet nuget push "artifacts/*.nupkg"
          --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
